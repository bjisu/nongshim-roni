<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>메론킥 슛!</title>
  <meta name="description" content="방향과 파워를 맞춰 골대 안 메론킥을 맞혀라! 로니와 함께하는 슈팅 게임" />
  <meta property="og:title" content="메론킥 슛!" />
  <meta property="og:description" content="방향과 파워를 맞춰 메론킥을 명중시켜라! 3번의 기회, 최대 300점!" />
  <meta name="theme-color" content="#C8E86B" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">

    <!-- ═══════════ 랜딩 화면 ═══════════ -->
    <section id="screen-landing" class="screen is-active">
      <div class="landing-deco deco-1"></div>
      <div class="landing-deco deco-2"></div>
      <div class="landing-inner">
        <div class="landing-hero">
          <img src="assets/images/roni.png?v=2" alt="로니" class="landing-roni" draggable="false" />
          <img src="assets/images/ball.png?v=2" alt="" class="landing-ball" draggable="false" />
        </div>
        <h1 class="landing-title">메론킥 슛!</h1>
        <p class="landing-sub">방향과 파워를 맞춰 메론킥을 명중시켜라!</p>
        <p id="best-score-label" class="best-score hidden">
          🏆 내 최고기록 <strong id="best-score-value">0점</strong>
        </p>
        <button id="btn-start" class="btn btn-primary" type="button">시작하기</button>
      </div>
    </section>

    <!-- ═══════════ 게임 화면 ═══════════ -->
    <section id="screen-game" class="screen">
      <!-- 배경(assets/images/bg.png)은 CSS background-image로 적용 -->
      <div class="game-inner">
        <!-- 상단 HUD -->
        <div class="hud">
          <div class="hud-chip hud-score">점수 <strong id="hud-score">0</strong></div>
          <div class="hud-chip hud-shots">남은 기회 <strong id="hud-shots">x3</strong></div>
        </div>

        <!-- 골대 영역 (배경 이미지의 골대 위치에 맞춘 논리 영역) -->
        <div id="goal-area" class="goal-area">
          <div id="goal-net-fx" class="goal-net-fx" aria-hidden="true"></div>
          <div id="snack" class="snack">
            <img id="snack-img" src="assets/images/melonkick.png" alt="메론킥 과자" draggable="false" />
          </div>
          <div id="hit-popup" class="hit-popup hidden">+100</div>
        </div>

        <!-- 하단 슈팅 존: 공 + 조준 화살표 -->
        <div class="shoot-zone">
          <div class="ball-wrap">
            <div id="aim-arrow" class="aim-arrow hidden" aria-hidden="true">
              <svg viewBox="0 0 40 120" width="40" height="120">
                <defs>
                  <linearGradient id="arrow-grad" x1="0" y1="1" x2="0" y2="0">
                    <stop offset="0%" stop-color="#ff9a3c" stop-opacity="0.25" />
                    <stop offset="100%" stop-color="#ef5b25" stop-opacity="0.95" />
                  </linearGradient>
                </defs>
                <path d="M20 4 L34 34 L25 30 L25 116 L15 116 L15 30 L6 34 Z"
                      fill="url(#arrow-grad)" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" />
              </svg>
            </div>
            <img id="shoot-ball" src="assets/images/ball.png?v=2" alt="공" class="shoot-ball" draggable="false" />
          </div>
        </div>

        <!-- 비행용 공 (.game-inner 기준 좌표 · JS가 transform 제어) -->
        <img id="fly-ball" src="assets/images/ball.png?v=2" alt="" class="fly-ball hidden" draggable="false" />

        <!-- 파워 게이지 -->
        <div class="power-wrap">
          <span class="power-label">파워</span>
          <div class="power-bar">
            <div class="power-track"></div>
            <div id="power-cursor" class="power-cursor"></div>
          </div>
        </div>

        <p id="phase-hint" class="phase-hint">탭해서 방향을 정해요!</p>
      </div>

      <!-- 카운트다운 오버레이 -->
      <div id="countdown" class="countdown hidden">
        <span id="countdown-num">3</span>
      </div>

      <!-- 판정 플래시 -->
      <div id="judge-flash" class="judge-flash hidden"></div>
    </section>

    <!-- ═══════════ 결과 화면 ═══════════ -->
    <section id="screen-result" class="screen">
      <div id="confetti-layer" class="confetti-layer"></div>
      <div class="result-inner">
        <p id="new-record-badge" class="new-record hidden">🎉 최고기록 갱신!</p>
        <div class="result-card">
          <p class="result-card-title">나의 슈팅 점수</p>
          <p class="result-accuracy"><span id="result-number">0</span><em>점</em></p>
          <div class="accuracy-bar"><div id="accuracy-fill" class="accuracy-fill"></div></div>
          <p id="result-hits" class="result-hits">명중 0 / 3</p>
          <p id="result-grade" class="result-grade">퍼펙트!</p>
          <div class="result-roni-wrap">
            <img id="result-roni" src="assets/images/roni.png?v=2" alt="로니" class="result-roni" draggable="false" />
          </div>
          <p id="result-comment" class="result-comment"></p>
          <p class="result-best">내 최고기록 <strong id="result-best-value">0점</strong></p>
        </div>
        <div class="result-actions">
          <button id="btn-retry" class="btn btn-primary" type="button">다시하기</button>
        </div>
      </div>
    </section>

    <!-- 가로 모드 안내 (게임은 세로 전용) -->
    <div class="rotate-overlay" aria-hidden="true">
      <span class="rotate-icon">📱</span>
      <p>세로 화면으로 돌려주세요</p>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
